name: CI

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  homebrew:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tap this checkout
        run: brew tap --custom-remote agents-tools/tap "$GITHUB_WORKSPACE"
      - name: Validate formulae
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            bash Scripts/check "$PR_BASE" "$PR_HEAD"
          else
            bash Scripts/check
          fi
      - name: Diff check
        run: git diff --check

  presentation:
    uses: agents-tools/.github/.github/workflows/presentation.yml@c748c42410ded7d6419b92b2603e7882e6087311
